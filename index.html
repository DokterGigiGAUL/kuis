<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wonder App Kedokteran Gigi</title>
    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
   <link rel="icon" type="image/png" href="assets/images/favicon-32x32.png">
   <!--<link rel="apple-touch-icon" href="/apple-touch-icon.png">-->
    <link rel="stylesheet" href="css/index.css" />
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  </head>

  <body>
  <header class="header">
    <h1>Wonder App</h1>
    <div class="header-actions">
        <button onclick="openLogin()" id="loginBtn" class="btn btn-secondary" type="button">
            Login
        </button>
        <button onclick="logout()" id="logoutBtn" class="btn btn-secondary" type="button" style="display:none;">
            Logout
        </button>
    </div>
  </header>
    
  <main class="container">

    <section id="featured-hero" class="featured-hero">
  <div class="featured-overlay">

    <span class="featured-badge"></span>

    <h2 class="featured-title"></h2>

    <p class="featured-description"></p>

    <div class="featured-actions">
      <button class="btn btn-primary featured-btn">
        🔓 Buka
      </button>

      <button class="btn featured-catalog-btn">
        Katalog premium terbaru →
      </button>
    </div>

  </div>
</section>
    <section class="category-section">

  <div class="category-grid">

    <button class="category-card" data-category="quiz">
      <div class="category-icon">
        <!-- Ganti SVG ini -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2a5 5 0 0 0-5 5v1H6a3 3 0 0 0-3 3v2a3 3 0 0 0 3 3h1v1a5 5 0 0 0 10 0v-1h1a3 3 0 0 0 3-3v-2a3 3 0 0 0-3-3h-1V7a5 5 0 0 0-5-5z"/>
        </svg>
      </div>

      <span>Kuis Trivia</span>
    </button>

    <button class="category-card" data-category="case">
      <div class="category-icon">
        <!-- Ganti SVG ini -->
        <svg viewBox="0 0 24 24">
          <path d="M8 4h8l1 2h3v14H4V6h3l1-2zm4 4v3H9v2h3v3h2v-3h3v-2h-3V8z"/>
        </svg>
      </div>

      <span>Kartu Kasus</span>
    </button>

    <button class="category-card" data-category="tts">
      <div class="category-icon">
        <!-- Ganti SVG ini -->
        <svg viewBox="0 0 24 24">
          <path d="M3 3h5v5H3zm6 0h5v5H9zm6 0h6v5h-6zM3 9h5v5H3zm12 0h6v5h-6zM3 15h5v6H3zm6 0h5v6H9zm8-.4 4.4 4.4-1.4 1.4-4.4-4.4V21h-2v-8h8v2h-4.6z"/>
        </svg>
      </div>

      <span>TTS</span>
    </button>

    <button class="category-card" data-category="comic">
      <div class="category-icon">
        <!-- Ganti SVG ini -->
        <svg viewBox="0 0 24 24">
          <path d="M4 4h16v12H8l-4 4V4zm4 4h8v2H8zm0 4h5v2H8z"/>
        </svg>
      </div>

      <span>Komik</span>
    </button>

  </div>

</section>
    <!-- Template Card -->
    <section id="quiz-section" class="home-section">
      <div class="section-header">
        <h2>Kuis Trivia</h2>
        <a href="explore.html?tab=quiz">
          Lihat semua Kuis →</a>
      </div>
    <div id="quiz-list" class="horizontal-scroll"></div>
    </section>

    <section class="home-section">
      <div id="case-section" class="section-header">
        <h2>Kartu Kasus</h2>
        <a href="explore.html?tab=case">Lihat semua Kasus →</a>
      </div>
      <div id="case-container" class="horizontal-scroll"></div>
    </section>
      
    <section class="home-section">
      <div id="tts-section" class="section-header">
        <h2>TTS</h2>
        <a href="explore.html?tab=tts">Lihat semua →</a>
      </div>
      <div id="tts-container" class="horizontal-scroll"></div>
    </section>
        
    <section class="home-section">
      <div id="comic-section" class="section-header">
        <h2>Komik</h2>
        <a href="explore.html?tab=comic">Lihat semua →</a>
      </div>
      <div id="comics-container" class="horizontal-scroll"></div>
    </section>

    <section class="home-section">
      <div id="ebook-section" class="section-header">
        <h2>Ebook</h2>
        <a href="explore.html?tab=ebook">Lihat semua →</a>
      </div>
      <div id="ebook-container" class="horizontal-scroll"></div>
    </section>
      
  </main>

    <!-- Template -->
      
  <template id="content-card-template">
    <article class="content-card">
      <div class="featured-card-overlay">
        <span class="featured-badge"></span>
      </div>
      <img
        class="content-thumb"
        loading="lazy"
        alt="">

      <div class="content-info">
        <h3 class="content-title"></h3>
        <p class="content-description"></p>
        <button class="btn btn-primary content-btn">
          Buka →
        </button>
      </div>
    </article>
  </template>

<!--  <template id="featured-card-template">
    <article class="featured-card">
      <div class="featured-card-overlay">
        <span class="featured-badge"></span>
      </div>
      <img
        class="featured-card-thumb"
        loading="lazy"
        alt="">

      <div class="featured-card-info">
        <span class="featured-card-type" style="display:none;"></span>
        <h3 class="featured-card-title"></h3>
        <p class="featured-card-description"></p>
        <button class="btn btn-primary featured-card-btn">
          Buka →
        </button>
      </div>

    </article>
  </template> -->

  <!-- Premium Popup -->
<div id="premiumModal" class="premium-modal">
  <div class="premium-modal-content">

    <button id="closePremiumModal" class="premium-modal-close">
      ✕
    </button>

    <iframe
      id="premiumFrame"
      src=""
      loading="lazy"
      frameborder="0">
    </iframe>

  </div>
</div>

<div id="loginModal" class="login-modal">
    <div class="login-box">
        <button class="login-close" onclick="closeLogin()">&times;</button>
        <h2>Login</h2>
        <input id="loginEmail" type="email" placeholder="Email">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="loginEmail()" class="btn btn-primary login-email">Login</button>
        <button onclick="registerEmail()" class="btn btn-outline register-email">Daftar</button>
        <div class="divider">ATAU</div>
        <button onclick="loginGoogle()" class="btn btn-primary login-google">Login/ Daftar dengan Google</button>
    </div>
</div>

<script src="js/firebase.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/premium.js"></script>
<script src="js/purchase-manager.js"></script>

<script src="js/storage.js"></script>

<script src="js/quiz-data.js"></script>
<script src="js/comics-data.js"></script>
<script src="js/tts-data.js"></script>
<script src="js/case-data.js"></script>
<script src="js/ebook-data.js"></script>

<!-- <script src="js/content-card.js"></script> -->
<script src="js/index.js"></script>

<script src="https://mayarembed.r2.mayar.id/mayar-new-min.js"></script>

</body>
</html>
