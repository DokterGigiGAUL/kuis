<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test getProducts</title>
</head>
<body>

<button onclick="test()">Test getProducts</button>

<pre id="result"></pre>

<script>
const API_URL = "https://script.google.com/macros/s/AKFYxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx/exec";

async function test() {
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "getProducts"
            })
        });

        const data = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(data, null, 2);

        console.log(data);

    } catch (err) {
        console.error(err);
    }
}
</script>

</body>
</html>
