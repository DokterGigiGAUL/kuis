<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test getProducts</title>
</head>

<body>

<h2>Test getProducts()</h2>

<button id="testButton" type="button">
    Test getProducts
</button>

<pre id="result">Klik tombol untuk test...</pre>

<script>

const API_URL = "GANTI_DENGAN_URL_WEB_APP_GAS_KAMU";

document
    .getElementById("testButton")
    .addEventListener("click", testGetProducts);

async function testGetProducts() {

    const result = document.getElementById("result");

    result.textContent = "Menghubungi backend...";

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "getProducts"
            })
        });

        console.log("HTTP status:", response.status);

        const text = await response.text();

        console.log("Raw response:", text);

        let data;

        try {
            data = JSON.parse(text);
        } catch (e) {
            throw new Error(
                "Response bukan JSON:\n\n" + text
            );
        }

        result.textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        console.error("getProducts ERROR:", error);

        result.textContent =
            "ERROR:\n\n" + error.message;
    }
}

</script>

</body>
</html>
